rfram[2] = "There Are Three Steps to Join Our Club...<br><br>First of all, if you are not already, you MUST be a member of the National Rifle Association. To join the NRA, click <a href='https://membership.nrahq.org/forms/signup.asp' target='new'>HERE</a>.<br><br>Second, you must completely fill out an Application Form for New Membership.  To download an Application, click <a href='http://www.bullseyepistol.com:80/piasaapp.pdf' target='new2'>HERE</a>.<br><br>Third, you must submit your Application in person at one of the Monthly Club Meetings.  Our monthly meetings are held at 7pm on the third Thursday of every month.  You'll need to bring proof that your NRA membership is current.";
